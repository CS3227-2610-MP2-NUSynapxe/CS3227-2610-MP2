name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Java project and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Verify Java code and quality gates
        run: xvfb-run --auto-servernum ./gradlew check javadoc --no-daemon --console=plain

      - name: Install documentation dependencies
        working-directory: website
        run: npm ci

      - name: Build documentation site
        working-directory: website
        run: npm run build

      - name: Stage available report inputs
        if: always()
        shell: bash
        run: |
          mkdir -p ci-report-inputs/build
          if [[ -d build/reports ]]; then
            cp -R build/reports ci-report-inputs/build/
          fi
          if [[ -d build/test-results/test ]]; then
            mkdir -p ci-report-inputs/build/test-results
            cp -R build/test-results/test ci-report-inputs/build/test-results/
          fi

      - name: Upload quality reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-reports
          path: |
            ci-report-inputs/
          if-no-files-found: warn

  report:
    name: Report test and coverage results
    needs: verify
    if: >-
      ${{ always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Download report inputs
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: quality-reports
          path: .

      - name: Summarize report availability
        if: always()
        shell: bash
        run: |
          {
            echo "## CI report inputs"
            if compgen -G 'build/test-results/test/TEST-*.xml' > /dev/null; then
              echo "- JUnit XML: available"
            else
              echo "- JUnit XML: unavailable"
            fi
            if [[ -f build/reports/jacoco/test/jacocoTestReport.xml ]]; then
              echo "- JaCoCo XML: available"
            else
              echo "- JaCoCo XML: unavailable"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Calculate JaCoCo coverage summary
        id: coverage
        if: ${{ always() && hashFiles('build/reports/jacoco/test/jacocoTestReport.xml') != '' }}
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ github.token }}
          comment-type: summary

      - name: Publish combined JUnit and coverage report
        id: tests
        if: ${{ always() && hashFiles('build/test-results/test/TEST-*.xml') != '' }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: build/test-results/test/TEST-*.xml
          comment: true
          detailed_summary: true
          updateComment: true
          summary: |
            ### Coverage
            - Overall: ${{ steps.coverage.outputs['coverage-overall'] || 'unavailable' }}%
            - Changed code: ${{ steps.coverage.outputs['coverage-changed-files'] || 'unavailable' }}%
