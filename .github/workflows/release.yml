name: Release desktop installers

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

jobs:
  prepare-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is-release: ${{ steps.version.outputs.is-release }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate and normalize tag version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "is-release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package ${{ matrix.platform }}
    needs: prepare-release
    if: needs.prepare-release.outputs.is-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            extension: msi
          - os: macos-latest
            platform: macos
            extension: dmg
          - os: ubuntu-latest
            platform: linux
            extension: deb
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install wixtoolset --no-progress --yes

      - name: Make Gradle Wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Verify and package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat spotlessCheck check jacocoTestReport javadoc packageNative "-PreleaseVersion=${{ needs.prepare-release.outputs.version }}" --no-daemon

      - name: Verify and package on macOS
        if: runner.os == 'macOS'
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest pmdMain compileTestJava javadoc packageNative -PreleaseVersion=${{ needs.prepare-release.outputs.version }} --no-daemon

      - name: Verify and package on Ubuntu
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./gradlew spotlessCheck check jacocoTestReport javadoc packageNative -PreleaseVersion=${{ needs.prepare-release.outputs.version }} --no-daemon

      - name: Upload native installer
        uses: actions/upload-artifact@v7
        with:
          name: NUSynapxe-${{ needs.prepare-release.outputs.version }}-${{ matrix.platform }}
          path: build/packages/NUSynapxe-${{ needs.prepare-release.outputs.version }}-${{ matrix.platform }}.${{ matrix.extension }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare-release, package]
    if: needs.prepare-release.outputs.is-release == 'true' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all native installers
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: NUSynapxe-${{ needs.prepare-release.outputs.version }}-*
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: NUSynapxe ${{ needs.prepare-release.outputs.version }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
