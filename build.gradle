import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask
import java.util.Locale

plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs' version '6.5.11'
    id 'com.diffplug.spotless' version '8.10.2'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'edu.nus.cs3227'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'nusynapxe.NUSynapxeApp'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

tasks.register('demoData', JavaExec) {
    group = 'application'
    description = 'Resets or seeds a database for demonstrations.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'nusynapxe.tools.DemoDataCli'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    doFirst {
        String command = providers.gradleProperty('demoDataCommand').orElse('').get()
        String databasePath = providers.gradleProperty('demoDatabasePath').orElse('').get()
        if (command.isBlank() || databasePath.isBlank()) {
            throw new GradleException(
                'demoData requires -PdemoDataCommand and -PdemoDatabasePath')
        }
        args(command, databasePath)
        if (providers.gradleProperty('demoDataForce').orElse('false').get() == 'true') {
            args('--force')
        } else if (providers.gradleProperty('demoDataReset').orElse('false').get() == 'true') {
            args('--reset')
        }
    }
}

tasks.named('run', JavaExec) {
    def demoDatabasePath = providers.gradleProperty('demoDatabasePath')
    if (demoDatabasePath.isPresent()) {
        systemProperty 'nusynapxe.database', demoDatabasePath.get()
    }
}

def javafxVersion = '25.0.4'
def universalJavafxModules = ['base', 'graphics', 'controls']

javafx {
    version = javafxVersion
    modules = ['javafx.controls']
}

configurations {
    universalJavafxWindows
    universalJavafxLinux
    universalJavafxMacArm
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.39'

    universalJavafxModules.each { module ->
        universalJavafxWindows("org.openjfx:javafx-${module}:${javafxVersion}:win") {
            transitive = false
        }
        universalJavafxLinux("org.openjfx:javafx-${module}:${javafxVersion}:linux") {
            transitive = false
        }
        universalJavafxMacArm("org.openjfx:javafx-${module}:${javafxVersion}:mac-aarch64") {
            transitive = false
        }
    }

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'org.testfx:testfx-junit5:4.0.18'
    testImplementation 'org.hamcrest:hamcrest:3.0'
    testImplementation 'com.tngtech.archunit:archunit:1.5.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        googleJavaFormat('1.36.1')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '14.1.0'
    configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.withType(org.gradle.api.plugins.quality.Checkstyle).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

pmd {
    toolVersion = '7.26.0'
    ruleSetFiles = files('config/pmd/ruleset.xml')
    ruleSets = []
    consoleOutput = true
}

tasks.named('pmdMain') {
    ruleSetFiles = files('config/pmd/ruleset.xml')
}

tasks.named('pmdTest') {
    enabled = true
    ruleSetFiles = files('config/pmd/test-ruleset.xml')
}

tasks.withType(org.gradle.api.plugins.quality.Pmd).configureEach {
    ignoreFailures = false
    reports {
        html.required = true
        xml.required = true
    }
}

spotbugs {
    toolVersion = '4.10.3'
    effort = Effort.valueOf('MAX')
    reportLevel = Confidence.valueOf('MEDIUM')
    ignoreFailures = false
    excludeFilter = file('config/spotbugs/exclude-filter.xml')
}

tasks.withType(SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

tasks.named('spotbugsTest') {
    enabled = true
}

jacoco {
    toolVersion = '0.8.14'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.65
            }
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
    dependsOn tasks.named('checkstyleMain')
    dependsOn tasks.named('checkstyleTest')
    dependsOn tasks.named('pmdMain')
    dependsOn tasks.named('pmdTest')
    dependsOn tasks.named('spotbugsMain')
    dependsOn tasks.named('spotbugsTest')
    dependsOn tasks.named('test')
    dependsOn tasks.named('jacocoTestReport')
    dependsOn tasks.named('jacocoTestCoverageVerification')
    dependsOn tasks.named('javadoc')
}

def packageOperatingSystem = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def nativePackagePlatform
def nativePackageType
def nativePackageExtension
if (packageOperatingSystem.contains('windows')) {
    nativePackagePlatform = 'windows'
    nativePackageType = 'msi'
    nativePackageExtension = 'msi'
} else if (packageOperatingSystem.contains('mac')) {
    nativePackagePlatform = 'macos'
    nativePackageType = 'dmg'
    nativePackageExtension = 'dmg'
} else if (packageOperatingSystem.contains('linux')) {
    nativePackagePlatform = 'linux'
    nativePackageType = 'deb'
    nativePackageExtension = 'deb'
} else {
    throw new GradleException("Native packaging is not supported on ${System.getProperty('os.name')}.")
}

def releaseVersion = {
    def value = providers.gradleProperty('releaseVersion').orNull
    if (value == null || !(value ==~ /\d+\.\d+\.\d+/)) {
        throw new GradleException('Set -PreleaseVersion=<major>.<minor>.<patch> when packaging NUSynapxe.')
    }
    return value
}

def jpackageVersion = { String type ->
    def version = releaseVersion()
    // macOS requires the first app-version component to be positive, unlike SemVer 0.x.y releases.
    return type == 'dmg' && version.startsWith('0.') ? "1.${version.substring(2)}" : version
}

def executableJarMainClass = 'nusynapxe.NUSynapxeLauncher'

tasks.register('fatJar', Jar) {
    group = 'distribution'
    description = 'Builds a platform-specific executable JAR containing the application runtime dependencies.'
    dependsOn tasks.named('classes')
    archiveBaseName = 'NUSynapxe'
    archiveVersion = providers.gradleProperty('releaseVersion').orElse(project.version.toString())
    archiveClassifier = 'fat'
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE

    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST'
    manifest {
        attributes([
            'Main-Class': executableJarMainClass,
            'Enable-Native-Access': 'ALL-UNNAMED'
        ])
    }
}

def jarTrees = { Collection<File> files ->
    files.collect { file ->
        file.isDirectory() ? file : zipTree(file)
    }
}

tasks.register('universalFatJar', Jar) {
    group = 'distribution'
    description = 'Builds one executable JAR for Windows x64, Linux x64, and macOS ARM64.'
    dependsOn tasks.named('classes')
    archiveBaseName = 'NUSynapxe'
    archiveVersion = providers.gradleProperty('releaseVersion').orElse(project.version.toString())
    archiveClassifier = ''
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE

    from sourceSets.main.output
    from {
        jarTrees(configurations.runtimeClasspath.files.findAll { !it.name.startsWith('javafx-') })
    }
    from { jarTrees(configurations.universalJavafxWindows.files) }
    from { jarTrees(configurations.universalJavafxLinux.files) }
    from { jarTrees(configurations.universalJavafxMacArm.files) }

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST'
    manifest {
        attributes([
            'Main-Class': executableJarMainClass,
            'Enable-Native-Access': 'ALL-UNNAMED'
        ])
    }
}

def packagingJavaHome = {
    def launcher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }.get()
    return launcher.metadata.installationPath.asFile
}

def packageTool = {
    def javaHome = packagingJavaHome()
    def executableName = packageOperatingSystem.contains('windows') ? 'jpackage.exe' : 'jpackage'
    def executable = new File(javaHome, "bin/${executableName}")
    if (!executable.isFile()) {
        throw new GradleException(
                "A full JDK 25 with jpackage is required for native packaging. Missing: ${executable}")
    }
    return executable
}

def javafxModulePath = {
    def modules = configurations.runtimeClasspath.files.findAll {
        it.name ==~ /javafx-.+-(win|linux|linux-aarch64|mac|mac-aarch64)\.jar/
    }
    def jmodsDirectory = new File(packagingJavaHome(), 'jmods')
    if (modules.isEmpty()) {
        throw new GradleException('Could not resolve platform-specific JavaFX modules for native packaging.')
    }
    if (jmodsDirectory.isDirectory()) {
        modules.add(0, jmodsDirectory)
    }
    return modules.collect { it.absolutePath }.join(File.pathSeparator)
}

def jpackageArguments = { String type, File destination, File temporaryDirectory ->
    def installLib = layout.buildDirectory.dir('install/CS3227-2610-MP2/lib').get().asFile
    def mainJar = tasks.named('jar').get().archiveFile.get().asFile
    if (!installLib.isDirectory() || !new File(installLib, mainJar.name).isFile()) {
        throw new GradleException('The application distribution was not created before native packaging.')
    }

    def arguments = [
        '--type', type,
        '--dest', destination.absolutePath,
        '--temp', temporaryDirectory.absolutePath,
        '--name', 'NUSynapxe',
        '--app-version', jpackageVersion(type),
        '--vendor', 'NUS CS3227',
        '--description', 'A clinic appointment, records, and billing management system',
        '--input', installLib.absolutePath,
        '--main-jar', mainJar.name,
        '--main-class', application.mainClass.get(),
        '--module-path', javafxModulePath(),
        '--add-modules', 'javafx.controls,java.sql,java.logging,java.naming,jdk.crypto.ec',
        '--java-options', '--enable-native-access=ALL-UNNAMED'
    ]
    if (type == 'msi') {
        arguments.addAll(['--win-menu', '--win-menu-group', 'NUSynapxe', '--win-shortcut'])
    } else if (type == 'deb') {
        arguments.add('--linux-shortcut')
    } else if (type == 'dmg') {
        arguments.addAll(['--mac-package-identifier', 'edu.nus.cs3227.nusynapxe'])
    }
    return arguments
}

tasks.register('packageNative', Exec) {
    group = 'distribution'
    description = 'Builds the native NUSynapxe installer for the current operating system.'
    dependsOn tasks.named('installDist')
    inputs.files(configurations.runtimeClasspath)
    outputs.dir(layout.buildDirectory.dir('packages'))

    doFirst {
        def outputDirectory = layout.buildDirectory.dir('jpackage/installer').get().asFile
        def temporaryDirectory = layout.buildDirectory.dir('jpackage/temp').get().asFile
        delete(outputDirectory)
        delete(temporaryDirectory)
        mkdir(outputDirectory)
        mkdir(temporaryDirectory)
        commandLine(packageTool(), *jpackageArguments(nativePackageType, outputDirectory, temporaryDirectory))
    }

    doLast {
        def installerDirectory = layout.buildDirectory.dir('jpackage/installer').get().asFile
        def installers = fileTree(installerDirectory).matching {
            include "*.${nativePackageExtension}"
        }.files
        if (installers.size() != 1) {
            throw new GradleException("Expected one ${nativePackageExtension} installer, found ${installers.size()}.")
        }

        def outputDirectory = layout.buildDirectory.dir('packages').get().asFile
        mkdir(outputDirectory)
        copy {
            from installers.iterator().next()
            into outputDirectory
            rename { "NUSynapxe-${releaseVersion()}-${nativePackagePlatform}.${nativePackageExtension}" }
        }
    }
}
